# ============================================================
# .github/workflows/cflite_batch.yml
# Runs a longer, scheduled fuzz pass against fuzz_function,
# independent of any specific PR. This is what actually accumulates
# fuzzing time/coverage over days and weeks rather than the short
# per-PR budget in cflite_pr.yml.
# ============================================================

name: Batch Fuzzing

on:
  schedule:
    - cron: "0 4 * * *" # Once a day, 04:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  BatchFuzzing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
          - undefined
    steps:
      - name: Build Fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run Fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: "batch"
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
          # Optional but recommended: persists the corpus and crash
          # artifacts between runs instead of starting from scratch
          # every night. Needs a PAT with write access to whatever
          # repo you point this at (a small, dedicated storage repo
          # is the usual pattern -- not this repo itself).
          # storage-repo: https://${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/privateMwb/FunctionPro-fuzz-corpus.git
          # storage-repo-branch: main
          # storage-repo-branch-coverage: gh-pages
